[package]
name = "macro-center"
version = "0.1.0"
description = "A Visual Programming Tool for keyboard and mouse macros"
authors = ["Lucas de Linhares <lucasdelinhares@gmail.com>"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "macro_center_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libmacrocenter = { path = "../libmacrocenter" }
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
indexmap = { version = "1.9.3", features = ["std"] }


[patch.crates-io]
indexmap = { version = "1.9.3", features = ["std"] }
